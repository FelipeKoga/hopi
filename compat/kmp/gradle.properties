# This build runs with the repository's wrapper (./gradlew -p compat/kmp), which reads this file and
# not the repository's: the same memory settings, one Gradle at a time.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
# Xcode 27.1 is newer than any Kotlin/Native this fixture is built with was tested on.
kotlin.apple.xcodeCompatibility.nowarn=true
