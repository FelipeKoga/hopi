# This build runs with compat/floor-gradle or the repository's wrapper (./gradlew -p compat/android),
# which read this file and not the repository's: the same memory settings, one Gradle at a time.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
# AGP 8.0 and 8.1.0 were tested up to compileSdk 33; this silences their warning about 34.
android.suppressUnsupportedCompileSdk=34
