# This build runs with compat/floor-gradle or the repository's wrapper (./gradlew -p compat/jvm),
# which read this file and not the repository's: the same memory settings, one Gradle at a time.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
