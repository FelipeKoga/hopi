name: Hopi
options:
  bundleIdPrefix: dev.koga.hopi
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Hopi:
    type: application
    platform: macOS
    sources:
      - path: Hopi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.koga.hopi.mac
        PRODUCT_NAME: Hopi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hopi
        INFOPLIST_KEY_CFBundleIconFile: Hopi
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Apache-2.0"
        # The viewer reads $TMPDIR/hopi, runs xcrun simctl and, later, adb: no sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
