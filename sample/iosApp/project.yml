# The Xcode project of the iOS sample. iosApp.xcodeproj is generated from this file and checked in,
# so building needs only Xcode; after editing this file run `xcodegen generate` here
# (generated with XcodeGen 2.46.0).
name: iosApp
options:
  bundleIdPrefix: dev.koga.hopi
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # The Gradle build phase writes into sample/shared/build, outside what Xcode's script sandbox allows.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  iosApp:
    type: application
    platform: iOS
    # A shared scheme, so `xcodebuild -scheme iosApp` works from a fresh checkout; its test action
    # runs the Swift capture tests (sample/iosApp/scripts/capture-swift-test.sh).
    scheme:
      testTargets:
        - iosAppCaptureTests
    sources:
      - path: iosApp
        excludes:
          - "Info-*.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.koga.hopi.sample
        PRODUCT_NAME: HopiSample
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # The shared framework has no x86_64 simulator slice (iosSimulatorArm64 only), and Release
        # builds every architecture: without this a Release simulator build fails on x86_64.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        # The static framework embedAndSignAppleFrameworkForXcode puts here for this configuration and SDK.
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Shared"
          # A Debug Kotlin/Native framework links every wrapper of the platform libraries it
          # uses, built against the current SDK, so symbols newer than iOS 18 become strong
          # imports (kCGAdaptiveMaximumBitDepth, libresolv's __res_9_p_*_syms): weak linking those
          # two lets the Debug app launch on older runtimes (iOS 18.2) too.
          - "-weak_framework"
          - "CoreGraphics"
          - "-weak-lresolv"
      configs:
        # Debug allows cleartext to the dev server on the host loopback only; Release has no ATS exception.
        Debug:
          INFOPLIST_FILE: iosApp/Info-Debug.plist
          # The capture tests call the Kotlin framework's test accessor through the host app's
          # binary, which a dead-stripping link would drop as unreferenced.
          DEAD_CODE_STRIPPING: NO
          # One setting for the build phase below and for Swift: HOPI_ENABLED (on in Debug) makes the
          # phase build the framework with Hopi and sets the Swift condition HOPI (`#if HOPI` around
          # Hopi.shared.start, iOSApp.swift), so `xcodebuild ... HOPI_ENABLED=false` compiles
          # neither. XcodeGen writes a boolean as YES, hence the YES condition; the true one serves
          # `HOPI_ENABLED=true` on the command line, and the phase links Hopi for these two values
          # only. Set on this target, not the project, so $(inherited) keeps the project's DEBUG
          # condition; Release sets none of them.
          HOPI_ENABLED: "YES"
          HOPI_SWIFT_CONDITION_YES: HOPI
          HOPI_SWIFT_CONDITION_true: HOPI
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(HOPI_SWIFT_CONDITION_$(HOPI_ENABLED))"
        Release:
          INFOPLIST_FILE: iosApp/Info-Release.plist
    preBuildScripts:
      - name: Build the shared Kotlin framework
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          # Debug links Hopi's runtimes and hopi-start, which Swift starts Hopi with (behind
          # `#if HOPI`); any other configuration no runtime and no hopi-start, only hopi-api and
          # the Ktor plugin's noop twin (docs/ARCHITECTURE.md, "Selecting the runtimes in a KMP
          # project"), and the iOS release guard fails a Release link that would hold a runtime.
          # Only the HOPI_ENABLED values that set Swift's HOPI, YES and true, link Hopi, so the two
          # never disagree: any other value, or none (which meant on before HOPI existed), builds a
          # Debug app without Hopi, as `xcodebuild ... HOPI_ENABLED=false` does for A/B runs at the
          # same optimisation level.
          set -eu
          cd "$SRCROOT/../.."
          case "$CONFIGURATION/${HOPI_ENABLED:-}" in
            Debug/YES | Debug/true)
              ./gradlew :sample:shared:embedAndSignAppleFrameworkForXcode -Phopi.enabled=true
              ;;
            *)
              ./gradlew :sample:shared:embedAndSignAppleFrameworkForXcode
              ;;
          esac
  # Swift concurrency's URLSession APIs under automatic capture (Kotlin/Native cannot call them):
  # hosted by the app, so they run in its process, after its Hopi.shared.start { … }.
  iosAppCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iosAppCaptureTests
    dependencies:
      - target: iosApp
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.koga.hopi.sample.capturetests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HopiSample.app/HopiSample"
        BUNDLE_LOADER: "$(TEST_HOST)"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
      configs:
        # The app's HOPI condition, which this target's settings do not inherit: without it the
        # `#if HOPI` in CaptureTests.swift would compile its start assertion out.
        Debug:
          HOPI_ENABLED: "YES"
          HOPI_SWIFT_CONDITION_YES: HOPI
          HOPI_SWIFT_CONDITION_true: HOPI
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(HOPI_SWIFT_CONDITION_$(HOPI_ENABLED))"
