			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Debug links Hopi's runtimes and hopi-start, which Swift starts Hopi with (behind\n# `#if HOPI`); any other configuration no runtime and no hopi-start, only hopi-api and\n# the Ktor plugin's noop twin (docs/ARCHITECTURE.md, \"Selecting the runtimes in a KMP\n# project\"), and the iOS release guard fails a Release link that would hold a runtime.\n# Only the HOPI_ENABLED values that set Swift's HOPI, YES and true, link Hopi, so the two\n# never disagree: any other value, or none (which meant on before HOPI existed), builds a\n# Debug app without Hopi, as `xcodebuild ... HOPI_ENABLED=false` does for A/B runs at the\n# same optimisation level.\nset -eu\ncd \"$SRCROOT/../..\"\ncase \"$CONFIGURATION/${HOPI_ENABLED:-}\" in\n  Debug/YES | Debug/true)\n    ./gradlew :sample:shared:embedAndSignAppleFrameworkForXcode -Phopi.enabled=true\n    ;;\n  *)\n    ./gradlew :sample:shared:embedAndSignAppleFrameworkForXcode\n    ;;\nesac\n";
		};
