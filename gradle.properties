# The development Mac has 8 GB of RAM: one Gradle JVM with the Kotlin compiler in-process.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true
# The version of every published Hopi artifact; the Gradle plugin adds the runtime of this version.
hopi.version=0.1.0
# Kotlin/Native 2.2.21 is tested with Xcode up to 26.0; this machine builds with Xcode 27.1.
kotlin.apple.xcodeCompatibility.nowarn=true
