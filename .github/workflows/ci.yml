name: CI

on:
  # Every branch and every tag.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    # Linux: the JVM, Android and Gradle plugin checks. Kotlin/Native compiles the iOS targets (their
    # Objective-C cinterop needs Xcode) on a Mac only, so the iOS checks, the iOS half of the
    # publication and the release itself run on the owner's Mac (docs/RELEASING.md). The repository
    # variable HOPI_RUNNER names another runner label without an edit.
    runs-on: ${{ vars.HOPI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Read the Kotlin version
        id: kotlin
        run: |
          version=$(sed -n 's/^kotlin = "\([^"]*\)".*/\1/p' gradle/libs.versions.toml | head -n 1)
          [ -n "$version" ] || { echo "::error file=gradle/libs.versions.toml::no kotlin version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}
      # platforms;android-37.0 (compileSdk 37), platforms;android-36 (the plugin's TestKit fixtures) and
      # build-tools;36.0.0 (AGP 9.4.0's), whichever the image lacks.
      - name: Install the Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-37.0" "platforms;android-36" "build-tools;36.0.0"
      - name: Base check
        run: |
          ./gradlew --continue :hopi-api:jvmTest :hopi-core:jvmTest :hopi-ktor:jvmTest :hopi-network:jvmTest \
            :hopi-cli:test :hopi-connect:test \
            :hopi-perf:jvmTest :hopi-perf:testAndroidHostTest check \
            :sample:androidApp:assembleDebug :sample:androidApp:verifyReleaseHasNoRuntime :hopi-network:testAndroidHostTest \
            :gradle-plugin:hopi-gradle-plugin:functionalTest :checkPublication
      - name: Upload the build reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-reports
          path: '**/build/reports/'
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
      # What the compat job consumes, rooted at the workspace (the two paths' common ancestor).
      # overwrite: a re-run of this job uploads it again under the same name.
      - name: Upload the publication repositories
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-repos
          path: |
            build/publication-check/
            gradle-plugin/build/functional-repo/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  compat:
    needs: check
    # As check: on Linux, compat/run.sh skips the iOS framework links (the Mac runs them).
    runs-on: ${{ vars.HOPI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Read the Kotlin version
        id: kotlin
        run: |
          version=$(sed -n 's/^kotlin = "\([^"]*\)".*/\1/p' gradle/libs.versions.toml | head -n 1)
          [ -n "$version" ] || { echo "::error file=gradle/libs.versions.toml::no kotlin version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}
      # functionalTestFloor and compat/android build at compileSdk 34, with build tools 34.0.0 on AGP
      # 8.0.2; the image starts at android-35 and build-tools 35.0.0.
      - name: Install the floor's Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-34" "build-tools;34.0.0"
      - name: Download the publication repositories
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication-repos
          path: ${{ github.workspace }}
      # Then stops the daemon, so that compat/run.sh's builds (--no-daemon) have the memory to themselves.
      - name: Plugin TestKit tests on the floor
        run: |
          ./gradlew :gradle-plugin:hopi-gradle-plugin:functionalTestFloor
          ./gradlew --stop
      - name: Consumer matrix
        run: compat/run.sh
      - name: Upload the compat logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-logs
          path: |
            build/compat/*.log
            gradle-plugin/hopi-gradle-plugin/build/reports/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
