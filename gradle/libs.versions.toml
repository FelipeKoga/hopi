[versions]
# Kotlin 2.2.21 writes every published artifact, so apps on Kotlin 2.2 can consume them: Kotlin/Native
# 2.2 skips a klib whose abi_version is above 2.2.0, and no flag of a newer compiler lowers it. It also
# drives the Compose compiler and the serialization plugin, here and in the included plugin build.
kotlin = "2.2.21"
agp = "9.4.0"
# The Compose Gradle plugin and the desktop viewer's screens (hopi-ui, hopi-desktop: JVM only, whose
# 1.12.0 jars carry Kotlin metadata 2.2.0).
compose-multiplatform = "1.12.0"
# The sample's Compose (sample/shared and sample/androidApp): the newest release whose iOS klibs are at
# abi_version 2.2.0 (1.11 and 1.12's are at 2.3.0, which Kotlin/Native 2.2.21 skips).
compose-multiplatform-sample = "1.10.3"
# Built with Kotlin 2.2.20; the published modules declare nothing above it (checkPublication).
coroutines = "1.11.0"
# The newest release built with Kotlin 2.2 (1.10 and later are built with 2.3).
serialization = "1.9.0"
# The newest release built with Kotlin 2.2 (3.4.0 is built with 2.3.0): hopi-ktor's consumers resolve
# no Ktor above it from Hopi (checkPublication).
ktor = "3.3.3"
# The Ktor the pilot app runs (Kotlin 2.4.20): `-Phopi.ktorForward=true` runs hopi-network's and
# hopi-ktor's tests on it (their test runtime classpaths only; they still compile against `ktor`).
ktor-forward = "3.5.2"
androidx-activity = "1.13.0"
# AGP 9.4.0's own ASM: the Gradle plugin's rewriter compiles against it, AGP supplies it at run time.
asm = "9.9"
# hopi-network compiles against the lowest OkHttp it supports, so no 5.x-only API creeps in; the
# rewriter's tests also run against the 5.x that Ktor brings.
okhttp = "4.12.0"
okhttp5 = "5.3.2"
# hopi-network's tests only: the 3.x OkHttp versions on either side of RequestBody.isDuplex() (3.14),
# with the Okio 1.x each was built with, and the Okio 3 that OkHttp 5 needs.
okhttp3-old = "3.12.13"
okio-okhttp3-old = "1.15.0"
okhttp3-last = "3.14.9"
okio-okhttp3-last = "1.17.2"
okio-okhttp5 = "3.17.0"
# The skiko native runtime that compose-multiplatform 1.12.0 resolves; JVM UI tests only.
skiko = "0.150.1"

android-compileSdk = "37"
# The compileSdk the five Android libraries' AARs require of an app (their aar-metadata's
# minCompileSdk): every android.* reference in them exists in API 34, which AGP 8.1.1 supports.
android-minCompileSdk = "34"
android-minSdk = "24"
android-targetSdk = "37"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# Dispatchers.Main on the AWT event thread; the desktop viewer only.
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktor-client-encoding = { module = "io.ktor:ktor-client-encoding", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "compose-multiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
# The sample's Compose (compose-multiplatform-sample).
compose-sample-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform-sample" }
compose-sample-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform-sample" }
compose-sample-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform-sample" }
compose-sample-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose-multiplatform-sample" }

asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asm-util = { module = "org.ow2.asm:asm-util", version.ref = "asm" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp5-jvm = { module = "com.squareup.okhttp3:okhttp-jvm", version.ref = "okhttp5" }
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
# The dev.koga.hopi plugin compiles its Kotlin Multiplatform path against the Kotlin Gradle plugin
# (compileOnly: a KMP build supplies it).
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
